<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">The money lifecycle</title>
  <desc id="desc">Original abstract illustration showing money in motion, at rest, and at work.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1D1F48"/><stop offset="1" stop-color="#454BAD"/></linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#4BCD3E"/><stop offset=".52" stop-color="#3BCFF0"/><stop offset="1" stop-color="#9BE86A"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="18" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="560" rx="34" fill="url(#bg)"/>
  <circle cx="1000" cy="95" r="190" fill="#3BCFF0" opacity=".1"/>
  <circle cx="110" cy="520" r="260" fill="#4BCD3E" opacity=".1"/>
  <path d="M130 300 C290 100 380 500 555 300 S815 100 970 300 S1090 410 1130 250" fill="none" stroke="url(#flow)" stroke-width="10" stroke-linecap="round" filter="url(#glow)"/>
  <g fill="#1D1F48" stroke="#fff" stroke-opacity=".88" stroke-width="3">
    <circle cx="180" cy="260" r="66"/><circle cx="480" cy="310" r="66"/><circle cx="760" cy="260" r="66"/><circle cx="1030" cy="305" r="66"/>
  </g>
  <g fill="#fff" text-anchor="middle" font-family="Arial,sans-serif">
    <text x="180" y="250" font-size="17" font-weight="700">MOVE</text><text x="180" y="276" font-size="14" opacity=".72">PAYMENTS</text>
    <text x="480" y="300" font-size="17" font-weight="700">STORE</text><text x="480" y="326" font-size="14" opacity=".72">BANKING</text>
    <text x="760" y="250" font-size="17" font-weight="700">GROW</text><text x="760" y="276" font-size="14" opacity=".72">INVESTING</text>
    <text x="1030" y="295" font-size="17" font-weight="700">CONNECT</text><text x="1030" y="321" font-size="14" opacity=".72">ECOSYSTEM</text>
  </g>
  <text x="68" y="86" fill="#fff" font-family="Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="3">FIS PRESENTATION STUDIO · ORIGINAL SAMPLE ARTWORK</text>
</svg>
