<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Template Demo</title>
<link rel="stylesheet" href="shared/brand.css">
<script src="shared/version.js"></script>
<script defer src="shared/deck.js"></script>
</head>
<!-- data-demo / data-chapter / data-page / data-pages drive the brand-kit top bar and progress ticks. -->
<body data-demo="Template Demo" data-chapter="Opening" data-page="1" data-pages="3">
<main class="stage">
  <canvas class="backdrop"></canvas>
  <section class="hero">
    <p class="eyebrow reveal">Template · Opening page</p>
    <h1 class="reveal" data-fis-field="headline">Your headline goes here.</h1>
    <p class="lede reveal">Prepared for <b data-fis-field="client.name">your client</b>. Replace this text with your opening story. Every value shown from the data set has a default in the HTML, so the page still reads well when a set leaves a field out.</p>
    <div class="row reveal"><span class="chip">Your L8 solution</span><span class="chip neutral" data-fis-field="client.segment">Segment</span></div>
  </section>
</main>
</body>
</html>
